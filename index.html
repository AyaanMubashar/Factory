<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile Project Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Frosted glass crystal light theme */
            --bg-color: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.55);
            --text-color: #0f172a;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --btn-text: #ffffff;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
            --toggle-bg: rgba(255, 255, 255, 0.6);
            --toggle-text: #1d4ed8;
            --border-color: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            /* Frosted glass crystal dark theme */
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --text-color: #f8fafc;
            --btn-bg: #3b82f6;
            --btn-hover: #60a5fa;
            --btn-text: #0f172a;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            --toggle-bg: rgba(255, 255, 255, 0.1);
            --toggle-text: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dashboard {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 45px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            transition: background 0.4s ease, box-shadow 0.4s ease, border 0.4s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--toggle-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--toggle-text);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .theme-toggle:hover {
            opacity: 0.85;
            transform: scale(1.05);
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙 Dark</button>
        <h1>Textile Management</h1>
        <div class="button-container">
            <a href="details.html" class="btn">Details</a>
            <a href="beam.html" class="btn">Beam</a>
            <a href="sizing.html" class="btn">Sizing</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light';
            }
        }
    </script>

</body>
</html>
